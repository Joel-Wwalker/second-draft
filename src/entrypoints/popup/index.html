<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Humanizer</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>Humanizer</h1>
    <textarea id="input" rows="8" placeholder="Paste text to humanize"></textarea>
    <div class="row">
      <select id="intensity" title="How much to change">
        <option value="light">Light touch</option>
        <option value="full">Full rewrite</option>
      </select>
      <button id="go">Humanize</button>
    </div>
    <p id="status" class="muted"></p>
    <textarea id="output" rows="8" readonly></textarea>
    <div class="row">
      <span id="engine" class="muted"></span>
      <button id="openOptions">Settings</button>
      <button id="copy" disabled>Copy</button>
    </div>
    <div class="row" id="siteRow" hidden>
      <label class="muted"><input type="checkbox" id="siteToggle" /> Disable on <span id="siteHost"></span></label>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
