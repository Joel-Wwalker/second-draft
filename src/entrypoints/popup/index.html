<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Second Draft</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="head">
      <div class="ring" id="ring">
        <svg width="40" height="40" viewBox="0 0 40 40">
          <circle cx="20" cy="20" r="17" fill="none" stroke="var(--track)" stroke-width="4"></circle>
          <circle
            id="ringFg"
            cx="20"
            cy="20"
            r="17"
            fill="none"
            stroke="var(--accent)"
            stroke-width="4"
            stroke-linecap="round"
            stroke-dasharray="106.8"
            stroke-dashoffset="106.8"
          ></circle>
        </svg>
        <span id="ringNum" class="num"></span>
      </div>
      <div class="headline">
        <div id="headline" class="h">Second Draft</div>
        <p id="status" class="muted"></p>
      </div>
    </div>

    <div class="field">
      <div class="cap">
        <label for="input">Your text</label>
        <span class="hint">or right click a selection on any page</span>
      </div>
      <textarea id="input" rows="4" placeholder="Paste or type text"></textarea>
    </div>

    <div class="controls">
      <div id="intensity" class="seg" role="group" aria-label="How much to change">
        <button type="button" class="seg-opt" data-value="light" aria-pressed="true">Light touch</button>
        <button type="button" class="seg-opt" data-value="full" aria-pressed="false">Full rewrite</button>
      </div>
      <button id="go">Humanize</button>
    </div>

    <div class="field" id="outField" hidden>
      <div class="cap">
        <label>Rewritten</label>
        <span class="hint" id="engine"></span>
      </div>
      <div id="out" class="out"></div>
    </div>

    <p id="profileNote" class="note" hidden></p>
    <div id="fidelity" class="fidelity" hidden></div>
    <details id="changesBox" hidden>
      <summary>What changed</summary>
      <div id="changesList"></div>
    </details>

    <div id="resultRow" hidden>
      <button id="regen">Try again</button>
      <button id="copy">Copy</button>
      <button id="undo" hidden>Undo</button>
      <button id="apply" hidden>Apply to page</button>
    </div>

    <div class="foot">
      <label class="site" id="siteRow" hidden>
        <input type="checkbox" id="siteToggle" />
        <span>Turn off on <span id="siteHost"></span></span>
      </label>
      <button id="openOptions">Settings</button>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
